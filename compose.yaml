name: flux
services:
  flux:
    image: ghcr.io/sequoyahgeber/flux-api:stable
    build: { context: ., target: unified }
    container_name: flux
    runtime: runsc
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, SETPCAP]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 5700m
    memswap_limit: 5700m
    pids_limit: 256
    tmpfs: [/tmp:rw,noexec,nosuid,nodev,size=192m,mode=1777]
    extra_hosts: [flux-api:127.0.0.1]
    environment:
      FLUX_OWNER_EMAIL: ${FLUX_OWNER_EMAIL:?Set the invitation owner email}
      ACCESS_ISSUER: ${ACCESS_ISSUER:?Set the Cloudflare Access issuer}
      ACCESS_AUD: ${ACCESS_AUD:?Set the Access application audience}
      WORKER_SECRET: ${WORKER_SECRET:?Set a random 32-byte worker secret}
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set the Cloudflare tunnel token}
    volumes: [api-work:/work/api, worker-work:/work/worker, scanner-work:/work/scanner, definitions:/var/lib/clamav]
    networks: [outbound]
    restart: on-failure:3
    logging: { driver: json-file, options: { max-size: 5m, max-file: "2" } }
networks:
  outbound: { name: flux-outbound, external: true }
volumes:
  definitions: { name: flux-antivirus-definitions }
  api-work: { name: flux-api-work, external: true }
  worker-work: { name: flux-worker-work, external: true }
  scanner-work: { name: flux-scanner-work, external: true }

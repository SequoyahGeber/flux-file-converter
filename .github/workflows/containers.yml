name: Test and publish containers
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - run: node --test tests/web-security.test.cjs tests/access.test.cjs tests/runtime.test.cjs
      - run: npm run format:check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  mac-client-tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: python3 scripts/mac-project.py
      - name: Check URL restrictions and safe file replacement
        run: xcrun swiftc mac/Flux/ClientPolicy.swift mac/Flux/SafeSave.swift tests/mac-policy.swift -o /tmp/flux-mac-policy && /tmp/flux-mac-policy
      - name: Build the universal native client without signing credentials
        run: xcodebuild -project mac/Flux.xcodeproj -scheme Flux -configuration Release -derivedDataPath /tmp/flux-native-ci CODE_SIGNING_ALLOWED=NO build
      - run: python3 scripts/ios-project.py
      - name: Build the iPhone client without signing credentials
        run: xcodebuild -project ios/Flux.xcodeproj -scheme Flux -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/flux-ios-ci CODE_SIGNING_ALLOWED=NO build
  build:
    needs: [security-tests, mac-client-tests]
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: unified
          load: true
          tags: ghcr.io/sequoyahgeber/flux-api:candidate
          labels: |
            org.opencontainers.image.source=https://github.com/SequoyahGeber/flux-file-converter
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=unified
            type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=unified
      - name: Scan image for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/sequoyahgeber/flux-api:candidate
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
      - name: Verify privilege dropping, conversion sandbox and real conversions
        run: |
          docker run --rm --user 10002:10002 --cap-drop ALL --security-opt no-new-privileges --entrypoint /usr/local/bin/flux-sandbox ghcr.io/sequoyahgeber/flux-api:candidate /usr/local/bin/node -e "const net=require('net');net.connect(443,'1.1.1.1').on('connect',()=>process.exit(1)).on('error',e=>process.exit(e.code==='EPERM'?0:1))"
          docker run --name flux-test --read-only --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --security-opt no-new-privileges --cpus 2 --memory 5700m --memory-swap 5700m --pids-limit 256 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=192m,mode=1777 --tmpfs /work:rw,noexec,nosuid,nodev,size=512m -e WORKER_SECRET=ci-only-secret-00000000000000000000000 ghcr.io/sequoyahgeber/flux-api:candidate --verify
      - name: Diagnostics
        if: failure()
        run: docker logs --tail 100 flux-test || true
      - name: Publish candidate image
        if: github.event_name != 'pull_request'
        run: |
          docker tag ghcr.io/sequoyahgeber/flux-api:candidate ghcr.io/sequoyahgeber/flux-api:sha-${{ github.sha }}
          docker push ghcr.io/sequoyahgeber/flux-api:sha-${{ github.sha }}
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          {
            registry: ghcr.io,
            username: '${{ github.actor }}',
            password: '${{ secrets.GITHUB_TOKEN }}',
          }
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
      - name: Promote tested image to stable and sign its digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image=ghcr.io/sequoyahgeber/flux-api
          docker pull "$image:sha-${{ github.sha }}"
          # A slow, older release must never replace the current main release.
          current=$(gh api repos/SequoyahGeber/flux-file-converter/commits/main --jq .sha)
          if [ "$current" = "${{ github.sha }}" ]; then
            docker tag "$image:sha-${{ github.sha }}" "$image:stable"
            docker push "$image:stable"
          fi
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image:sha-${{ github.sha }}")
          cosign sign --yes "$digest"

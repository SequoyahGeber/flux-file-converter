name: Test and publish containers
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - run: node --test tests/web-security.test.cjs
      - run: npm audit --omit=dev --audit-level=high
  build:
    needs: security-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, antivirus]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: ghcr.io/sequoyahgeber/flux-${{ matrix.target }}:candidate
          labels: |
            org.opencontainers.image.source=https://github.com/SequoyahGeber/flux-file-converter
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Scan image for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/sequoyahgeber/flux-${{ matrix.target }}:candidate
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
      - name: Verify conversion sandbox and run real conversions
        if: matrix.target == 'worker'
        run: |
          docker run --rm --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges --entrypoint /usr/local/bin/flux-sandbox ghcr.io/sequoyahgeber/flux-worker:candidate /usr/local/bin/node -e "const net=require('net');net.connect(443,'1.1.1.1').on('connect',()=>process.exit(1)).on('error',e=>process.exit(e.code==='EPERM'?0:1))"
          docker run -d --name worker --read-only --cap-drop ALL --security-opt no-new-privileges --cpus 1.5 --memory 3g --pids-limit 192 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001 --tmpfs /work:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001 -e WORKER_SECRET=ci-only-secret-00000000000000000000000 -p 127.0.0.1:8090:8090 ghcr.io/sequoyahgeber/flux-worker:candidate
          npm ci --ignore-scripts
          sleep 3
          WORKER_SECRET=ci-only-secret-00000000000000000000000 node tests/container-smoke.cjs
      - name: Publish candidate image
        if: github.event_name != 'pull_request'
        run: |
          docker tag ghcr.io/sequoyahgeber/flux-${{ matrix.target }}:candidate ghcr.io/sequoyahgeber/flux-${{ matrix.target }}:sha-${{ github.sha }}
          docker push ghcr.io/sequoyahgeber/flux-${{ matrix.target }}:sha-${{ github.sha }}
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
      - name: Promote tested images to stable and sign digests
        run: |
          for target in api worker antivirus; do
            image=ghcr.io/sequoyahgeber/flux-$target
            docker pull "$image:sha-${{ github.sha }}"
            docker tag "$image:sha-${{ github.sha }}" "$image:stable"
            docker push "$image:stable"
            digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image:sha-${{ github.sha }}")
            cosign sign --yes "$digest"
          done
